<style>
:root{
  --bg:#0b0b0d; --card:#17171b; --card2:#222228; --ink:#ffffff; --sub:#d0d0d8; --line:#4a4a54;
  --accent:#8b5cf6; --accent-soft:rgba(139,92,246,.16);
}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;line-height:1.6;word-break:keep-all;overflow-wrap:break-word}
.wrap{max-width:560px;margin:0 auto;padding:24px 16px 64px}
.brand{font-size:13px;color:var(--sub);letter-spacing:.04em;margin-bottom:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:24px 20px;box-shadow:0 8px 32px rgba(0,0,0,.5)}
h1{font-size:26px;line-height:1.3;margin:0 0 10px}
h2{font-size:20px;line-height:1.4;margin:0 0 18px}
p{margin:0 0 12px}
.sub{color:var(--sub);font-size:15px}
.btn{display:block;width:100%;text-align:center;border:0;border-radius:12px;padding:15px 16px;font-size:16px;font-weight:700;cursor:pointer;background:var(--accent);color:#fff;text-decoration:none;font-family:inherit}
.btn:hover{filter:brightness(.95)}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line);font-weight:600}
.opt{display:block;width:100%;text-align:left;background:var(--card2);border:1.5px solid #5a5a66;border-radius:12px;padding:14px 16px;font-size:16px;margin-bottom:10px;cursor:pointer;font-family:inherit;color:var(--ink)}
.opt:hover,.opt:focus-visible{border-color:var(--accent);background:var(--accent-soft);outline:none}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:18px 0}
.grid .opt{margin:0;text-align:center;font-weight:600}
.bar{height:6px;background:#3a3a43;border-radius:99px;overflow:hidden;margin-bottom:18px}
.bar i{display:block;height:100%;background:var(--accent);width:0;transition:width .3s}
.step{font-size:13px;color:var(--sub);margin-bottom:6px}
.tag{display:inline-block;background:var(--accent-soft);color:#c4b5fd;font-size:13px;font-weight:700;border-radius:99px;padding:4px 12px;margin-bottom:10px}
.emoji{font-size:46px;line-height:1;margin-bottom:8px}
.radar{display:block;margin:6px auto 14px;max-width:320px;width:100%}
.rows{border-top:1px solid var(--line);margin-top:8px}
.row{padding:12px 0;border-bottom:1px solid var(--line)}
.row b{display:block;font-size:13px;color:#c4b5fd;font-weight:700;margin-bottom:2px}
.diag{background:var(--accent-soft);border-radius:12px;padding:14px 16px;margin:16px 0;font-size:15px}
.diag b{color:#c4b5fd}
.note{font-size:13px;color:var(--sub);margin-top:12px}
.stack{display:grid;gap:10px;margin-top:14px}
.hide{display:none}
.back{background:none;border:0;color:var(--sub);font-size:14px;font-family:inherit;cursor:pointer;padding:6px 0;margin:0 0 6px}
.back:hover,.back:focus-visible{color:var(--ink);outline:none}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:#f4f4f5;color:#0b0b0d;padding:10px 18px;border-radius:99px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .25s}
.toast.on{opacity:1}
</style>
</head>
<body>
<div class="wrap">
  <div class="brand">일문일도네이밍 · BRAND CHECK</div>

  <!-- 시작 -->
  <section id="s-start" class="card">
    <div class="emoji">🔍</div>
    <h1>1분 브랜드체크</h1>
    <p class="sub">우리 브랜드는 어떤 성격일까? 7가지 질문에 답하면 성격 유형, 강점, 그리고 가장 먼저 채워야 할 부분까지 알려준다.</p>
    <p style="font-weight:700;margin-top:20px">어떤 일을 하고 있는가?</p>
    <div class="grid" id="biz-grid"></div>
    <p class="note">입력한 내용은 저장되거나 전송되지 않는다.</p>
  </section>

  <!-- 질문 -->
  <section id="s-quiz" class="card hide">
    <button class="back" id="back" type="button"></button>
    <div class="step" id="step"></div>
    <div class="bar"><i id="bar"></i></div>
    <h2 id="q"></h2>
    <div id="opts"></div>
  </section>

  <!-- 결과 -->
  <section id="s-result" class="card hide"></section>
</div>
<div class="toast" id="toast"></div>

/* 조사 자동 선택: 마지막 글자 받침 유무로 이/가, 을/를 결정 */
function hasFinal(w){
  var c=w.charCodeAt(w.length-1);
  if(c<0xAC00||c>0xD7A3) return false;
  return (c-0xAC00)%28!==0;
}
function ga(w){ return w+(hasFinal(w)?"이":"가"); }
function eul(w){ return w+(hasFinal(w)?"을":"를"); }

     desc:"친근하고 편안해서 한 번 오면 계속 찾게 되는 브랜드다. 사람 냄새가 가장 큰 무기다.",

     nameTone:"부드러운 한글 이름, 2~3글자, 소리 내어 부르기 편한 이름",
     sloganTone:"말을 걸듯 다정한 한 문장",
     avoid:"차갑고 어려운 외래어, 지나치게 긴 이름"},
  p:{emoji:"🧭", name:"믿음직한 전문가형",
     desc:"실력과 신뢰가 중심인 브랜드다. 고객이 안심하고 맡길 수 있다는 점이 핵심 가치다.",
     strength:"가격 경쟁에서 벗어나 신뢰로 선택받는다. 고단가 상품과 서비스에 잘 맞는다.",
     risk:"딱딱하고 거리감 있게 보일 수 있다. 전문성만 있고 이야기가 없으면 비슷한 곳과 구분되지 않는다.",

     avoid:"지나치게 장난스러운 이름, 뜻이 모호한 조어"},
  u:{emoji:"🎨", name:"개성 만점 크리에이터형",
     desc:"다르다는 것 자체가 브랜드인 유형이다. 한 번 보면 잊기 어려운 존재감이 있다.",
     strength:"SNS와 입소문을 타기 쉽고, 팬이 생기면 충성도가 매우 높다.",
     risk:"독특함이 지나치면 무엇을 하는 곳인지 전달되지 않는다. 발음과 검색이 어려운 이름은 특히 위험하다.",
     nameTone:"리듬감 있는 신조어, 의외의 단어 조합, 짧고 강한 이름",
     sloganTone:"한 번 들으면 따라 하고 싶은 재치 있는 문장",
     avoid:"설명이 필요한 이름, 검색에서 다른 단어에 묻히는 이름"},
  l:{emoji:"💎", name:"품격 있는 프리미엄형",
     desc:"절제와 분위기로 가치를 전하는 브랜드다. 말을 많이 하지 않아도 격이 느껴지는 유형이다.",
     strength:"가격 대비 가치 인식이 높고, 브랜드 이미지 자체가 상품이 된다.",
     risk:"문턱이 높아 보일 수 있다. 처음 온 고객에게 다가가는 한 줄의 친절이 필요하다.",
     nameTone:"여백이 느껴지는 짧은 이름, 영문·한글 혼합, 소리가 고운 이름",
     sloganTone:"절제된 한 줄, 설명하지 않고 암시하는 문장",
     avoid:"유행어, 가벼운 말장난, 과한 수식"},
  s:{emoji:"📖", name:"이야기가 있는 스토리텔러형",
     desc:"왜 시작했는지가 곧 브랜드의 힘인 유형이다. 고객은 상품보다 이야기에 마음을 준다.",
     strength:"공감과 팬덤을 만들기 쉽다. 이름 하나에도 의미를 담아 오래 기억시킬 수 있다.",

};

var WEAK = {
  f:"고객이 편하게 다가올 수 있는 친근함이 부족하다. 처음 온 사람이 기억하기 쉬운 부드러운 이름과 말투를 채워야 한다.",
  p:"신뢰의 근거가 부족하다. 이름과 슬로건에 확실한 약속을 담고, 랜딩페이지에서 그 증거를 보여줘야 한다.",
  s:"가장 부족한 것은 스토리다. 이름에 담긴 이유와 시작한 이야기가 있어야 비슷한 곳들 사이에서 기억된다.",
  u:"가장 부족한 것은 차별점이다. 지금 모습으로는 비슷한 곳에 묻힐 수 있어, 기억에 남을 한 끗이 필요하다.",
  l:"브랜드의 격을 보여주는 요소가 약하다. 이름의 소리, 로고의 여백, 페이지의 톤을 하나의 분위기로 맞춰야 한다."
};

var state = {biz:null, i:0, sc:{f:0,p:0,u:0,l:0,s:0}, hist:[]};
var $ = function(id){return document.getElementById(id)};

function show(id){
  ["s-start","s-quiz","s-result"].forEach(function(x){$(x).classList.add("hide")});
  $(id).classList.remove("hide");
  window.scrollTo({top:0,behavior:"smooth"});
}

/* 업종 버튼 */
Object.keys(BIZ).forEach(function(k){
  var b=document.createElement("button");
  b.className="opt"; b.textContent=BIZ[k].n;
  b.onclick=function(){ state.biz=k; state.i=0; state.sc={f:0,p:0,u:0,l:0,s:0}; state.hist=[]; renderQ(); show("s-quiz"); };
  $("biz-grid").appendChild(b);
});

function renderQ(){
  var b=BIZ[state.biz], Q=QS[state.i];
  $("step").textContent="질문 "+(state.i+1)+" / "+QS.length;
  $("back").textContent=state.i===0?"← 업종 다시 고르기":"← 이전 질문";
  $("bar").style.width=((state.i)/QS.length*100)+"%";
  $("q").textContent=Q.q(b);
  var box=$("opts"); box.innerHTML="";
  Q.o.forEach(function(o){
    var btn=document.createElement("button");
    btn.className="opt"; btn.textContent=o[0];
    btn.onclick=function(){ pick(o[1]); };
    box.appendChild(btn);
  });
}

function goBack(){
  if(state.i===0){ show("s-start"); return; }
  var last=state.hist.pop();
  for(var k in last){ state.sc[k]-=last[k]; }
  state.i--;
  renderQ();
}
$("back").onclick=goBack;

function pick(add){
  state.hist.push(add);
  for(var k in add){ state.sc[k]+=add[k]; }
  state.i++;
  if(state.i>=QS.length){ $("bar").style.width="100%"; renderResult(); show("s-result"); }
  else renderQ();
}

function pct(k){
  /* 질문 7개, 축당 최대 약 12점 기준으로 환산 */
  return Math.max(15, Math.min(100, Math.round(state.sc[k]/12*100)));
}

function radarSVG(){
  var cx=150, cy=150, R=100, n=AX.length, out="";
  function pt(i,r){
    var a=(-90+i*360/n)*Math.PI/180;
    return [cx+r*Math.cos(a), cy+r*Math.sin(a)];
  }
  [0.25,0.5,0.75,1].forEach(function(lv){
    var p=AX.map(function(_,i){return pt(i,R*lv).join(",")}).join(" ");
    out+='<polygon points="'+p+'" fill="none" stroke="#5c5c68" stroke-width="1"/>';
  });
  AX.forEach(function(_,i){
    var p=pt(i,R);
    out+='<line x1="'+cx+'" y1="'+cy+'" x2="'+p[0]+'" y2="'+p[1]+'" stroke="#5c5c68"/>';
  });
  var data=AX.map(function(a,i){return pt(i,R*pct(a.k)/100).join(",")}).join(" ");
  out+='<polygon points="'+data+'" fill="rgba(139,92,246,.30)" stroke="#a78bfa" stroke-width="2.5" stroke-linejoin="round"/>';
  AX.forEach(function(a,i){
    var p=pt(i,R*pct(a.k)/100);
    out+='<circle cx="'+p[0]+'" cy="'+p[1]+'" r="4" fill="#a78bfa"/>';
    var l=pt(i,R+26);
    out+='<text x="'+l[0]+'" y="'+l[1]+'" text-anchor="middle" dominant-baseline="middle" font-size="13" font-weight="700" fill="#f4f4f5">'+a.n+'</text>';
  });
  return '<svg class="radar" viewBox="0 0 300 300" role="img" aria-label="브랜드 성향 레이더 차트">'+out+'</svg>';
}

function ranked(){
  /* 점수 동률이면 AX 순서 유지 */
  return AX.map(function(a,i){return {k:a.k,n:a.n,v:state.sc[a.k],i:i}})
           .sort(function(a,b){return b.v-a.v || a.i-b.i});
}

function renderResult(){
  var r=ranked(), top=r[0], second=r[1], weak=r[r.length-1];
  var T=TYPES[top.k], b=BIZ[state.biz];
  var html=
    '<div class="tag">'+b.n+' 브랜드체크 결과</div>'+
    '<div class="emoji">'+T.emoji+'</div>'+
    '<h1>'+T.name+'</h1>'+
    '<p class="sub">'+T.desc+'</p>'+
    radarSVG()+
    '<div class="rows">'+
      '<div class="row"><b>보조 성향</b>'+second.n+' 성향이 함께 나타난다. 이 두 가지를 합친 톤이 우리 브랜드다운 목소리다.</div>'+
      '<div class="row"><b>강점</b>'+T.strength+'</div>'+
      '<div class="row"><b>이 유형이 흔히 하는 실수</b>'+T.risk+'</div>'+
      '<div class="row"><b>어울리는 이름의 결</b>'+T.nameTone+'</div>'+
      '<div class="row"><b>어울리는 슬로건 톤</b>'+T.sloganTone+'</div>'+
      '<div class="row"><b>피해야 할 것</b>'+T.avoid+'</div>'+
    '</div>'+
    '<div class="diag"><b>한 줄 체크 · '+weak.n+' 보완 필요</b><br>'+WEAK[weak.k]+'</div>'+
    '<div class="stack">'+
      (SHOW_CONTACT?'<a class="btn" href="'+CONTACT_URL+'">이 결과로 이름·슬로건·로고 패키지 상담받기</a>':'')+
      (SHOW_SHARE?'<button class="btn ghost" id="b-share">결과 공유하기</button>':'')+
      '<button class="btn'+((SHOW_CONTACT||SHOW_SHARE)?' ghost':'')+'" id="b-again">다시 체크하기</button>'+
    '</div>'+
    '<p class="note">이 체크는 브랜드 방향을 가늠하는 간단한 도구다. 실제 이름은 상표 중복, 도메인, 발음, 의미 검토를 거쳐야 안전하게 사용할 수 있다.</p>';
  $("s-result").innerHTML=html;
  $("b-again").onclick=function(){ show("s-start"); };
  if($("b-share")) $("b-share").onclick=function(){ share(T,top,second,weak,b); };
}

function toast(msg){
  var t=$("toast"); t.textContent=msg; t.classList.add("on");
  setTimeout(function(){t.classList.remove("on")},1800);
}

function copyText(full){
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(full).then(function(){toast("결과가 복사됐다")},function(){legacyCopy(full)});
  }else{
    legacyCopy(full);
  }
}
function legacyCopy(full){
  var ta=document.createElement("textarea"); ta.value=full; ta.style.position="fixed"; ta.style.opacity="0";
  document.body.appendChild(ta); ta.select();
  try{ document.execCommand("copy"); toast("결과가 복사됐다"); }
  catch(e){ toast("복사에 실패했다"); }
  document.body.removeChild(ta);
}

function share(T,top,second,weak,b){
  var text="우리 "+b.biz+"의 브랜드 유형은 \""+T.name+"\" "+T.emoji+"\n"+
           "보조 성향: "+second.n+" / 보완 필요: "+weak.n+"\n"+
           "1분 브랜드체크 · "+BRAND_NAME;
  var url=location.href.split("#")[0];
  var full=text+"\n"+url;
  if(navigator.share){
    navigator.share({title:"1분 브랜드체크", text:text, url:url}).catch(function(e){
      /* 사용자가 공유창을 닫은 경우는 무시, 그 외(iframe 권한 등)는 복사로 대체 */
      if(e&&e.name==="AbortError") return;
      copyText(full);
    });
    return;
  }
  copyText(full);
}
</script>
</body>
</html>
